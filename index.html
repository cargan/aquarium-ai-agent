<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium AI Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-8">
    <header class="max-w-6xl mx-auto mb-12 text-center">
        <h1 class="text-4xl font-bold text-blue-400 mb-2">🐠 Smart Aquarium Monitor</h1>
        <p class="text-slate-400">Automated AI Vision Analysis History</p>
    </header>

    <main id="history-container" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Įrašai bus įkelti čia -->
        <div class="col-span-full text-center py-20" id="loader">
            <p class="animate-pulse text-xl text-slate-500">Loading aquarium history...</p>
        </div>
    </main>

    <script>
        async function loadHistory() {
            const repo = "cargan/aquarium-ai-agent";
            const container = document.getElementById('history-container');
            const loader = document.getElementById('loader');

            try {
                // 1. Gauname visus failus iš 'logs' folderio (kur tavo agentas saugo JSON)
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/logs`);
                const files = await response.json();

                // Filtruojame tik JSON failus ir rūšiuojame nuo naujausio
                const logFiles = files.filter(f => f.name.endsWith('.json')).reverse();

                loader.remove();

                for (const file of logFiles) {
                    const logDataRes = await fetch(file.download_url);
                    const log = await logDataRes.json();

                    // Sukuriame kortelę
                    const card = document.createElement('div');
                    card.className = "card rounded-xl overflow-hidden shadow-2xl flex flex-col";
                    
                    card.innerHTML = `
                        <img src="snapshots/${log.image_filename}" class="w-full h-64 object-cover" alt="Aquarium Snapshot">
                        <div class="p-6">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-sm font-mono text-blue-400">${log.date}</span>
                                <span class="px-2 py-1 bg-blue-900/50 text-blue-200 text-xs rounded">AI Verified</span>
                            </div>
                            <h3 class="text-xl font-semibold mb-2">Analysis</h3>
                            <p class="text-slate-300 text-sm leading-relaxed">${log.analysis}</p>
                            <div class="mt-4 pt-4 border-t border-slate-700 flex gap-4 text-xs text-slate-500">
                                <span>Fish Count: ${log.metrics.fish_count || 'N/A'}</span>
                                <span>Clarity: ${log.metrics.water_clarity || 'Good'}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (err) {
                console.error(err);
                loader.innerHTML = "<p class='text-red-400'>Error loading logs. Check your repo structure.</p>";
            }
        }
        loadHistory();
    </script>
</body>
</html>
