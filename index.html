<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium AI Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .main-card { background-color: #1e293b; border: 1px solid #334155; }
        .nav-item { transition: all 0.2s; border-bottom: 1px solid #334155; }
        .nav-item:hover { background-color: #334155; }
        .active-date { border-left: 4px solid #3b82f6; background-color: #1e293b; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="max-w-6xl mx-auto mb-8">
        <h1 class="text-3xl font-bold text-blue-400">🐠 Aquarium AI Monitor</h1>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- KAIRĖ: Datų navigacija -->
        <aside class="lg:col-span-1 order-2 lg:order-1">
            <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">History Log</h2>
            <div id="date-navigation" class="max-h-[600px] overflow-y-auto rounded-lg border border-slate-700 bg-slate-800/50">
                <p class="p-4 text-slate-500 animate-pulse">Loading dates...</p>
            </div>
        </aside>

        <!-- DEŠINĖ: Pagrindinis vaizdas -->
        <section class="lg:col-span-3 order-1 lg:order-2">
            <div id="main-display" class="main-card rounded-2xl overflow-hidden shadow-2xl">
                <div class="p-20 text-center text-slate-500">Select a date to see analysis</div>
            </div>
        </section>

    </main>

    <script>
        const repo = "cargan/aquarium-ai-agent";

        async function init() {
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/logs`);
                const files = await response.json();
                const logFiles = files.filter(f => f.name.endsWith('.json')).reverse();

                const nav = document.getElementById('date-navigation');
                nav.innerHTML = '';

                logFiles.forEach((file, index) => {
                    // Ištraukiame datą iš failo pavadinimo (pvz. 2026-05-13.json -> 2026-05-13)
                    const dateLabel = file.name.replace('.json', '');
                    
                    const btn = document.createElement('button');
                    btn.className = `nav-item w-full text-left p-4 flex justify-between items-center ${index === 0 ? 'active-date' : ''}`;
                    btn.innerHTML = `<span>${dateLabel}</span> <span class="text-xs text-slate-500">→</span>`;
                    
                    btn.onclick = () => {
                        // Nuimame aktyvią klasę nuo visų
                        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active-date'));
                        // Uždedame šiam
                        btn.classList.add('active-date');
                        loadSpecificLog(file.download_url);
                    };
                    
                    nav.appendChild(btn);
                });

                // Automatiškai užkrauname naujausią įrašą
                if (logFiles.length > 0) {
                    loadSpecificLog(logFiles[0].download_url);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('date-navigation').innerHTML = "<p class='p-4 text-red-400'>Error.</p>";
            }
        }

        async function loadSpecificLog(url) {
            const display = document.getElementById('main-display');
            display.innerHTML = '<div class="p-20 text-center animate-pulse">Analyzing...</div>';

            try {
                const res = await fetch(url);
                const log = await res.json();

                display.innerHTML = `
                    <img src="snapshots/${log.image_filename}" class="w-full h-[400px] object-cover border-b border-slate-700" alt="Aquarium">
                    <div class="p-8">
                        <div class="flex items-center gap-3 mb-6">
                            <span class="px-3 py-1 bg-blue-500/20 text-blue-400 text-xs font-bold rounded-full uppercase tracking-tighter">AI Analysis</span>
                            <span class="text-slate-500 font-mono text-sm">${log.date || ''}</span>
                        </div>
                        
                        <div class="prose prose-invert max-w-none">
                            <h2 class="text-2xl font-bold mb-4 text-white">Status Report</h2>
                            <p class="text-slate-300 leading-relaxed text-lg mb-8">${log.analysis || log.description || 'No analysis available'}</p>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-8 pt-8 border-t border-slate-700">
                            <div class="bg-slate-900/50 p-4 rounded-xl">
                                <p class="text-slate-500 text-xs uppercase mb-1">Fish Count</p>
                                <p class="text-xl font-bold text-blue-400">${log.metrics?.fish_count || 'N/A'}</p>
                            </div>
                            <div class="bg-slate-900/50 p-4 rounded-xl">
                                <p class="text-slate-500 text-xs uppercase mb-1">Water Clarity</p>
                                <p class="text-xl font-bold text-blue-400">${log.metrics?.water_clarity || 'Good'}</p>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                display.innerHTML = `<div class="p-20 text-red-400 text-center">Failed to load details.</div>`;
            }
        }

        init();
    </script>
</body>
</html>
